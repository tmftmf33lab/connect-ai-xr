<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>AR Desk · CONNECT AI XR</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#0b0906}canvas{display:block}</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/", "connect-xr": "./vendor/connect-xr.js" } }
</script>
</head>
<body>
<script type="module">
// AR Desk: put small things on your real desk.
// Quest 3/3S: Enter AR, look at your desk, a gold ring shows where it lands, pinch (or trigger) to place.
// Real things in front hide the virtual ones (depth sensing) when the headset allows it.
// Quest 2, computer or phone: a wooden desk in a dim room appears; click / tap / pinch on it to place.
// Everything is drawn in code, no image or model files.
import { createXRApp, THREE, glassPanel, woodTexture, label, chime, mulberry } from 'connect-xr';

const CONFIG = {
  title: 'AR Desk',
  maxObjects: 30,                                   // the oldest goes away after this
  objects: ['monitor', 'plant', 'clock', 'mug', 'lamp'], // the order NEXT goes through
  names: { monitor: 'Monitor', plant: 'Plant', clock: 'Clock', mug: 'Mug', lamp: 'Desk lamp' },
  notes: { monitor: 523.25, plant: 587.33, clock: 659.25, mug: 783.99, lamp: 880 },
};

const app = await createXRApp({ title: CONFIG.title, prefer: 'ar', hitTest: true, depth: true, cameraPos: [0.95, 1.38, 0.75], target: [0, 0.86, -0.62], background: 0x0b0906 });
const { scene } = app;
const rnd = mulberry(11);

// ---------- materials ----------
const brass = new THREE.MeshStandardMaterial({ color: 0xd6892a, metalness: 1, roughness: 0.28 });
const black = new THREE.MeshStandardMaterial({ color: 0x15120f, metalness: 0.4, roughness: 0.4 });
const ivory = new THREE.MeshStandardMaterial({ color: 0xebe2d2, roughness: 0.35 });
const leaf = new THREE.MeshStandardMaterial({ color: 0x3f6b3a, roughness: 0.75, side: THREE.DoubleSide });
const clay = new THREE.MeshStandardMaterial({ color: 0x8a4a30, roughness: 0.8 });

// the monitor's screen: a gold gradient with the brand, drawn once
const scr = document.createElement('canvas'); scr.width = 512; scr.height = 300;
{
  const g = scr.getContext('2d'), gr = g.createLinearGradient(0, 0, 512, 300);
  gr.addColorStop(0, '#1a1208'); gr.addColorStop(0.55, '#5a3410'); gr.addColorStop(1, '#d6892a');
  g.fillStyle = gr; g.fillRect(0, 0, 512, 300);
  g.strokeStyle = 'rgba(242,180,90,0.35)'; g.lineWidth = 2;
  for (let i = 0; i < 7; i++) { g.beginPath(); g.moveTo(0, 220 - i * 18); for (let x = 0; x <= 512; x += 16) g.lineTo(x, 220 - i * 18 - Math.sin(x * 0.012 + i) * 14 - x * 0.08); g.stroke(); }
  g.fillStyle = '#EBE2D2'; g.font = '400 20px ui-sans-serif, -apple-system, Arial'; g.fillText('C O N N E C T   A I   L A B', 36, 60);
  g.fillStyle = '#F2B45A'; g.fillRect(36, 74, 46, 2);
  g.fillStyle = '#EBE2D2'; g.font = '400 54px "Didot","Bodoni 72",Georgia,serif'; g.fillText('Hello, desk.', 36, 140);
}
const scrTex = new THREE.CanvasTexture(scr); scrTex.colorSpace = THREE.SRGBColorSpace;

// clock face
const cf = document.createElement('canvas'); cf.width = cf.height = 256;
{
  const g = cf.getContext('2d'); g.fillStyle = '#EBE2D2'; g.beginPath(); g.arc(128, 128, 126, 0, 7); g.fill();
  g.fillStyle = '#15120f';
  for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; g.save(); g.translate(128, 128); g.rotate(a); g.fillRect(-2, -112, 4, i % 3 ? 10 : 20); g.restore(); }
  g.font = '400 22px "Didot","Bodoni 72",Georgia,serif'; g.textAlign = 'center'; g.fillText('CONNECT', 128, 92);
}
const cfTex = new THREE.CanvasTexture(cf); cfTex.colorSpace = THREE.SRGBColorSpace;

// ---------- the five things (sizes in metres, real desk scale) ----------
const clocks = [];
const MAKE = {
  monitor() {
    const g = new THREE.Group();
    const base = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.07, 0.01, 32), brass); base.position.y = 0.005;
    const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.12, 12), brass); neck.position.y = 0.07;
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.22, 0.014), black); body.position.y = 0.2;
    const face = new THREE.Mesh(new THREE.PlaneGeometry(0.34, 0.2), new THREE.MeshBasicMaterial({ map: scrTex, toneMapped: false })); face.position.set(0, 0.2, 0.0075);
    g.add(base, neck, body, face); return g;
  },
  plant() {
    const g = new THREE.Group();
    const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.038, 0.09, 24), clay); pot.position.y = 0.045;
    const rim = new THREE.Mesh(new THREE.TorusGeometry(0.05, 0.005, 8, 24), clay); rim.rotation.x = Math.PI / 2; rim.position.y = 0.09;
    g.add(pot, rim);
    for (let i = 0; i < 9; i++) {
      const l = new THREE.Mesh(new THREE.SphereGeometry(0.03, 8, 6), leaf); l.scale.set(0.45, 1.7, 0.12);
      const a = (i / 9) * Math.PI * 2; l.position.set(Math.cos(a) * 0.022, 0.15 + rnd() * 0.05, Math.sin(a) * 0.022);
      l.rotation.set(Math.cos(a) * 0.5, a, Math.sin(a) * 0.5); g.add(l);
    }
    return g;
  },
  clock() {
    const g = new THREE.Group();
    const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.075, 0.025, 40), brass); rim.rotation.x = Math.PI / 2; rim.position.y = 0.09;
    const face = new THREE.Mesh(new THREE.CircleGeometry(0.068, 40), new THREE.MeshStandardMaterial({ map: cfTex, roughness: 0.4 })); face.position.set(0, 0.09, 0.0128);
    const foot = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.012, 0.04), brass); foot.position.y = 0.006;
    const mk = (w, h) => { const p = new THREE.Group(); const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.002), black); m.position.y = h / 2 - 0.006; p.add(m); p.position.set(0, 0.09, 0.016); return p; };
    const hour = mk(0.006, 0.04), min = mk(0.004, 0.058), sec = mk(0.0015, 0.062);
    sec.children[0].material = brass;
    g.add(rim, face, foot, hour, min, sec);
    clocks.push({ hour, min, sec });
    return g;
  },
  mug() {
    const g = new THREE.Group();
    const cup = new THREE.Mesh(new THREE.CylinderGeometry(0.042, 0.036, 0.095, 28, 1, true), ivory); cup.position.y = 0.0475;
    cup.material = ivory.clone(); cup.material.side = THREE.DoubleSide;
    const bottom = new THREE.Mesh(new THREE.CircleGeometry(0.036, 28), ivory); bottom.rotation.x = -Math.PI / 2; bottom.position.y = 0.002;
    const coffee = new THREE.Mesh(new THREE.CircleGeometry(0.039, 28), new THREE.MeshStandardMaterial({ color: 0x2a160b, roughness: 0.15 })); coffee.rotation.x = -Math.PI / 2; coffee.position.y = 0.08;
    const handle = new THREE.Mesh(new THREE.TorusGeometry(0.022, 0.006, 8, 20, Math.PI), ivory); handle.rotation.z = -Math.PI / 2; handle.position.set(0.042, 0.05, 0);
    const band = new THREE.Mesh(new THREE.CylinderGeometry(0.0425, 0.0415, 0.008, 28, 1, true), brass); band.position.y = 0.07;
    g.add(cup, bottom, coffee, handle, band); return g;
  },
  lamp() {
    const g = new THREE.Group();
    const base = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.065, 0.015, 32), black); base.position.y = 0.0075;
    const arm1 = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.22, 10), brass); arm1.position.set(0.03, 0.115, 0); arm1.rotation.z = -0.28;
    const arm2 = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.18, 10), brass); arm2.position.set(-0.01, 0.27, 0); arm2.rotation.z = 0.9;
    const head = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.08, 28, 1, true), new THREE.MeshStandardMaterial({ color: 0x15120f, metalness: 0.5, roughness: 0.35, side: THREE.DoubleSide }));
    head.position.set(-0.085, 0.29, 0); head.rotation.z = 0.5;
    const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.018, 16, 12), new THREE.MeshBasicMaterial({ color: 0xffd9a0, toneMapped: false })); bulb.position.set(-0.098, 0.266, 0);
    // a soft pool of light on the desk (a glow disc, no real light: adding lights at runtime makes a headset stutter)
    const pool = new THREE.Mesh(new THREE.CircleGeometry(0.16, 32), new THREE.MeshBasicMaterial({ map: glowTex, color: 0xffb36b, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false }));
    pool.rotation.x = -Math.PI / 2; pool.position.set(-0.14, 0.003, 0);
    g.add(base, arm1, arm2, head, bulb, pool); return g;
  },
};

// radial glow (used for the lamp pool and the contact shadows)
function radial(inner, outer) {
  const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
  const gr = g.createRadialGradient(64, 64, 2, 64, 64, 64); gr.addColorStop(0, inner); gr.addColorStop(1, outer); g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}
const glowTex = radial('rgba(255,255,255,1)', 'rgba(255,255,255,0)');
const shadowTex = radial('rgba(0,0,0,0.6)', 'rgba(0,0,0,0)');

// ---------- the desk (VR, computer and phone only; in AR your real desk is used) ----------
const DESK = { w: 1.5, d: 0.75, h: 0.74, z: -0.62 };
const studio = new THREE.Group(); scene.add(studio);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), new THREE.MeshStandardMaterial({ map: woodTexture({ tone: [70, 44, 28], planks: 10, repeat: [3, 3] }), roughness: 0.6 }));
floor.rotation.x = -Math.PI / 2; floor.position.set(1.3, 0, 1.65); studio.add(floor);
const wallMat = new THREE.MeshStandardMaterial({ color: 0x241d17, roughness: 0.95 });
const wall = new THREE.Mesh(new THREE.PlaneGeometry(8, 3.2), wallMat); wall.position.set(0, 1.6, -1.35); studio.add(wall);
const side = new THREE.Mesh(new THREE.PlaneGeometry(4, 3.2), wallMat); side.rotation.y = Math.PI / 2; side.position.set(-1.7, 1.6, 0.65); studio.add(side);
// thin gold line on the wall, a quiet brand mark
const line = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 0.006), new THREE.MeshBasicMaterial({ color: 0xd6892a, toneMapped: false })); line.position.set(0.1, 1.5, -1.34); studio.add(line);
const word = label('CONNECT AI LAB', { size: 0.055, font: 'ui-sans-serif,-apple-system,Arial', weight: 300 }); word.position.set(0.1, 1.58, -1.34); studio.add(word);

const deskTex = woodTexture({ tone: [112, 70, 40], planks: 5, repeat: [1, 1] });
const deskMat = new THREE.MeshStandardMaterial({ map: deskTex, roughness: 0.38 });
const top = new THREE.Mesh(new THREE.BoxGeometry(DESK.w, 0.04, DESK.d), deskMat); top.position.set(0, DESK.h - 0.02, DESK.z); studio.add(top);
for (const [x, z] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
  const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.014, DESK.h - 0.04, 12), brass);
  leg.position.set(x * (DESK.w / 2 - 0.07), (DESK.h - 0.04) / 2, DESK.z + z * (DESK.d / 2 - 0.07)); studio.add(leg);
}
const deskShadow = new THREE.Mesh(new THREE.PlaneGeometry(DESK.w * 1.3, DESK.d * 1.5), new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false }));
deskShadow.rotation.x = -Math.PI / 2; deskShadow.position.set(0, 0.005, DESK.z); studio.add(deskShadow);
// an invisible "touch layer" on the desk top: what you click / tap / pinch to place
const touch = new THREE.Mesh(new THREE.PlaneGeometry(DESK.w - 0.06, DESK.d - 0.06), new THREE.MeshBasicMaterial({ visible: false }));
touch.rotation.x = -Math.PI / 2; touch.position.set(0, DESK.h + 0.001, DESK.z); studio.add(touch);

// hover ring on the desk (computer + VR)
const ghost = new THREE.Mesh(new THREE.RingGeometry(0.05, 0.065, 40).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xf2b45a, transparent: true, opacity: 0.85, toneMapped: false }));
ghost.visible = false; scene.add(ghost);

// ---------- lights ----------
const hemi = new THREE.HemisphereLight(0xffe9d0, 0x1a120c, 0.55); scene.add(hemi);
const key = new THREE.SpotLight(0xffc98f, 18, 6, 0.65, 0.6, 1.6); key.position.set(0.6, 2.4, 0.2); key.target.position.set(0, DESK.h, DESK.z); scene.add(key, key.target);
const rim = new THREE.DirectionalLight(0x8fa8ff, 0.35); rim.position.set(-2, 1.5, -2); scene.add(rim);

// ---------- placing ----------
const placed = [];
let nextIndex = 0;
const nameOf = (i) => CONFIG.names[CONFIG.objects[i % CONFIG.objects.length]];

function place(kind, matrixOrPoint, { quiet = false, yaw = null } = {}) {
  const obj = MAKE[kind]();
  const holder = new THREE.Group();
  if (matrixOrPoint.isMatrix4) {
    matrixOrPoint.decompose(holder.position, holder.quaternion, holder.scale);
    holder.scale.set(1, 1, 1);
  } else holder.position.copy(matrixOrPoint);
  // turn it to face you (yaw only)
  const eye = new THREE.Vector3();
  (app.renderer.xr.isPresenting ? app.renderer.xr.getCamera() : app.camera).getWorldPosition(eye);
  const up = new THREE.Vector3(0, 1, 0).applyQuaternion(holder.quaternion);
  if (up.y > 0.9) holder.quaternion.setFromAxisAngle(new THREE.Vector3(0, 1, 0), yaw ?? Math.atan2(eye.x - holder.position.x, eye.z - holder.position.z));
  const sh = new THREE.Mesh(new THREE.PlaneGeometry(0.22, 0.22), new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false }));
  sh.rotation.x = -Math.PI / 2; sh.position.y = 0.002; holder.add(sh);
  holder.add(obj);
  holder.userData = { kind, born: quiet ? -1 : performance.now() };
  if (!quiet) holder.scale.setScalar(0.001);
  scene.add(holder); placed.push(holder);
  while (placed.length > CONFIG.maxObjects) removeOne(placed.shift());
  if (!quiet) chime(app.audio, CONFIG.notes[kind], { gain: 0.12, time: 1.6 });
  return holder;
}
function removeOne(h) {
  scene.remove(h);
  h.traverse((o) => { if (o.geometry) o.geometry.dispose(); });
  const i = clocks.findIndex((c) => h.getObjectById(c.sec.id)); if (i >= 0) clocks.splice(i, 1);
}
function placeNext(where) {
  const kind = CONFIG.objects[nextIndex % CONFIG.objects.length];
  nextIndex++;
  place(kind, where);
  refresh();
}

// AR: the gold ring on a real surface, pinch / trigger places
app.onPlace((matrix) => placeNext(matrix));
// VR, computer, phone: the desk top
app.interactive(touch, ({ point }) => placeNext(point), (on, point) => {
  ghost.visible = !!(on && point);
  if (ghost.visible) ghost.position.set(point.x, DESK.h + 0.004, point.z);
});

// ---------- glass panel ----------
const panel = glassPanel(app, {
  width: 0.62, height: 0.36,
  buttons: [
    { id: 'next', label: 'NEXT OBJECT', x: 64, y: 444, w: 330, h: 84 },
    { id: 'undo', label: 'UNDO', x: 420, y: 444, w: 250, h: 84 },
    { id: 'clear', label: 'CLEAR', x: 696, y: 444, w: 260, h: 84 },
  ],
  draw(ctx, w, h) {
    ctx.fillStyle = '#D6892A'; ctx.fillRect(64, 70, 60, 3);
    ctx.fillStyle = '#EBE2D2'; ctx.font = '400 24px ui-sans-serif, -apple-system, Arial'; ctx.letterSpacing = '6px';
    ctx.fillText('CONNECT AI LAB  ·  AR DESK', 64, 122);
    ctx.letterSpacing = '0px';
    ctx.font = '400 30px ui-sans-serif, -apple-system, Arial'; ctx.fillStyle = 'rgba(235,226,210,0.6)';
    ctx.fillText('Next', 64, 196);
    ctx.font = '400 96px "Didot","Bodoni 72",Georgia,serif'; ctx.fillStyle = '#EBE2D2';
    ctx.fillText(nameOf(nextIndex), 64, 294);
    ctx.font = '400 30px ui-sans-serif, -apple-system, Arial'; ctx.fillStyle = '#F2B45A';
    ctx.textAlign = 'right'; ctx.fillText(`${placed.length} / ${CONFIG.maxObjects} placed`, w - 64, 196);
    ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(235,226,210,0.6)'; ctx.font = '400 26px ui-sans-serif, -apple-system, Arial';
    ctx.fillText(app.state.mode === 'ar' ? 'Look at your desk. Pinch where the gold ring is.' : 'Click, tap or pinch on the desk to place it.', 64, 380);
  },
  onButton(id) {
    if (id === 'next') nextIndex++;
    if (id === 'undo' && placed.length) removeOne(placed.pop());
    if (id === 'clear') while (placed.length) removeOne(placed.pop());
    chime(app.audio, { next: 698.46, undo: 440, clear: 349.23 }[id], { gain: 0.08, time: 1.0 });
  },
});
const refresh = () => panel.paint();
scene.add(panel.group);
const panelHome = { desk: new THREE.Vector3(-0.62, 1.22, -0.5), ar: new THREE.Vector3(-0.35, 1.25, -0.55) };
panel.group.position.copy(panelHome.desk);

// a few things on the desk already, so the first look is not empty
place('monitor', new THREE.Vector3(0.12, DESK.h, DESK.z - 0.16), { quiet: true, yaw: 0.1 });
place('plant', new THREE.Vector3(0.58, DESK.h, DESK.z - 0.2), { quiet: true });
place('clock', new THREE.Vector3(-0.3, DESK.h, DESK.z - 0.08), { quiet: true, yaw: 0.45 });
place('mug', new THREE.Vector3(0.36, DESK.h, DESK.z + 0.16), { quiet: true });
nextIndex = 4; refresh();

// AR: no desk, no walls: your real room. Start with an empty desk.
app.onModeChange((m) => {
  const ar = m === 'ar';
  studio.visible = !ar; touch.visible = !ar; ghost.visible = false;
  hemi.intensity = ar ? 1.1 : 0.55;
  if (ar) while (placed.length) removeOne(placed.pop());
  panel.group.position.copy(ar ? panelHome.ar : panelHome.desk);
  refresh();
});

// ---------- every frame ----------
const eye = new THREE.Vector3();
const backOut = (x) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
app.onFrame((dt, t) => {
  const now = performance.now();
  for (const h of placed) {
    if (h.userData.born < 0) continue;
    const k = Math.min(1, (now - h.userData.born) / 380);
    h.scale.setScalar(Math.max(0.001, backOut(k)));
    if (k >= 1) h.userData.born = -1;
  }
  const d = new Date(), s = d.getSeconds() + d.getMilliseconds() / 1000, mm = d.getMinutes() + s / 60, hh = (d.getHours() % 12) + mm / 60;
  for (const c of clocks) { c.sec.rotation.z = -s / 60 * Math.PI * 2; c.min.rotation.z = -mm / 60 * Math.PI * 2; c.hour.rotation.z = -hh / 12 * Math.PI * 2; }
  panel.group.position.y += (((app.state.mode === 'ar' ? panelHome.ar.y : panelHome.desk.y) + Math.sin(t * 0.8) * 0.006) - panel.group.position.y) * 0.1;
  (app.renderer.xr.isPresenting ? app.renderer.xr.getCamera() : app.camera).getWorldPosition(eye);
  const want = Math.atan2(eye.x - panel.group.position.x, eye.z - panel.group.position.z);
  panel.group.rotation.y += (want - panel.group.rotation.y) * Math.min(1, dt * 3);
});
</script>
</body>
</html>
